include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
  language:
    strict-casts: false
    strict-inference: false
