name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version & doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8+ compatibility
        run: |
          for DIR in "$HOME/.pub-cache/hosted/pub.dev"/*/android; do
            if [ -f "$DIR/build.gradle" ]; then
              # Add namespace if missing
              if ! grep -q "namespace" "$DIR/build.gradle"; then
                PKG=""
                if [ -f "$DIR/src/main/AndroidManifest.xml" ]; then
                  PKG=$(grep -oP 'package="\K[^"]+' "$DIR/src/main/AndroidManifest.xml" | head -1)
                fi
                if [ -z "$PKG" ]; then
                  NAME=$(basename $(dirname $DIR))
                  PKG="com.example.$(echo $NAME | tr '-' '_')"
                fi
                sed -i "s/android {/android {\n    namespace '$PKG'/" "$DIR/build.gradle"
              fi
              # Set compileSdk to 36
              sed -i "s/compileSdkVersion [0-9]\+/compileSdkVersion 36/g" "$DIR/build.gradle"
              sed -i "s/compileSdk [0-9]\+/compileSdk 36/g" "$DIR/build.gradle"
              sed -i "s/targetSdkVersion [0-9]\+/targetSdkVersion 36/g" "$DIR/build.gradle"
              echo "Patched $(dirname $DIR)"
            fi
            if [ -f "$DIR/build.gradle.kts" ]; then
              if ! grep -q "namespace" "$DIR/build.gradle.kts"; then
                PKG=""
                if [ -f "$DIR/src/main/AndroidManifest.xml" ]; then
                  PKG=$(grep -oP 'package="\K[^"]+' "$DIR/src/main/AndroidManifest.xml" | head -1)
                fi
                if [ -z "$PKG" ]; then
                  NAME=$(basename $(dirname $DIR))
                  PKG="com.example.$(echo $NAME | tr '-' '_')"
                fi
                sed -i "s/android {/android {\n    namespace = \"$PKG\"/" "$DIR/build.gradle.kts"
              fi
              sed -i "s/compileSdk = [0-9]\+/compileSdk = 36/g" "$DIR/build.gradle.kts"
              sed -i "s/targetSdk = [0-9]\+/targetSdk = 36/g" "$DIR/build.gradle.kts"
              echo "Patched $(dirname $DIR)"
            fi
          done
          echo "---"
          grep -n "namespace\|compileSdk" "$HOME/.pub-cache/hosted/pub.dev/mobile_scanner-3.5.7/android/build.gradle" 2>&1 | head -3

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-umkm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
